services:
  postgres:
    image: postgres:16-alpine
    container_name: recruitment_dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_dw}
      POSTGRES_USER: ${POSTGRES_USER:-recruitment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitment123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitment} -d ${POSTGRES_DB:-recruitment_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
